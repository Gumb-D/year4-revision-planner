<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Year 4 Revision Planner 2026</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font:14px system-ui}main{max-width:1380px;margin:auto;padding:16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:12px 0}.tabs,.actions{display:flex;gap:7px;flex-wrap:wrap}button,input,select{padding:8px;border:1px solid #d1d5db;border-radius:8px;background:#fff}button{cursor:pointer}.on,.primary{background:#4f46e5;color:#fff}.view{display:none}.view.on{display:block}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.day{min-height:145px;border:1px solid #ddd;border-radius:9px;padding:6px}.today{outline:3px solid #6366f1}.examday{background:#fff1f2}.fixed,.rev,.exam{font-size:10px;padding:3px;margin-top:3px;border-radius:5px}.fixed{background:#f2f4f7}.rev{background:#e0e7ff}.rev.done{background:#dcfce7;text-decoration:line-through}.exam{background:#fecdd3;font-weight:700}table{width:100%;border-collapse:collapse}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}.summary{display:flex;gap:25px;flex-wrap:wrap}.metric b{display:block;font-size:22px}.muted{color:#667085}@media(max-width:800px){.cal{overflow:auto;grid-template-columns:repeat(7,minmax(105px,1fr))}}</style></head><body><main><h1>Year 4 Final Exam Revision Planner</h1><p class="muted">20 Sep – 15 Oct 2026 · V6</p><div class="summary card"><div class="metric">Progress<b id="pct">0%</b></div><div class="metric">Completed<b id="completed">0/0</b></div><div class="metric">First Exam<b>12 Oct</b></div></div><div class="tabs"><button class="on" onclick="tab('calendar',this)">Calendar</button><button onclick="tab('schedule',this)">Revision Schedule</button><button onclick="tab('activities',this)">Tuition & Activities</button><button onclick="tab('exams',this)">Exam Timetable</button></div><section id="calendar" class="view on card"><div id="cal" class="cal"></div></section><section id="schedule" class="view card"><h2>Revision Schedule</h2><div class="actions"><select id="fd" onchange="renderRev()"><option value="">All Dates</option></select><select id="fs" onchange="renderRev()"><option value="">All Subjects</option></select><input id="fr" placeholder="Filter Revision..." oninput="renderRev()"><select id="fm" onchange="renderRev()"><option value="">All Mastery</option><option value="red">🔴 Needs Work</option><option value="yellow">🟡 Developing</option><option value="green">🟢 Mastered</option></select><select id="fo" onchange="renderRev()"><option value="">All Status</option><option value="done">Done</option><option value="todo">Not Done</option></select><button onclick="fd.value=fs.value=fr.value=fm.value=fo.value='';renderRev()">Clear Filters</button></div><p id="sum" class="muted"></p><div style="overflow:auto"><table><thead><tr><th>Date</th><th>Time</th><th>Subject</th><th>Revision</th><th>Mastery</th><th>Done</th></tr></thead><tbody id="rows"></tbody></table></div></section><section id="activities" class="view card"><h2>Tuition & Activities</h2><p class="muted">Times are editable and saved automatically in this browser.</p><table><tbody id="acts"></tbody></table></section><section id="exams" class="view card"><h2>Exam Timetable</h2><table><tbody id="examrows"></tbody></table></section><script>
const A={"Monday":[["School","07:00","13:00"],["English Tuition","14:00","16:00"],["Basketball","16:00","18:00"]],"Tuesday":[["School","07:00","13:00"],["Bahasa Melayu Tuition","15:00","17:00"]],"Wednesday":[["School","07:00","13:00"],["Extracurricular Activity","13:30","15:30"]],"Thursday":[["School","07:00","13:00"],["Basketball","15:30","17:30"]],"Friday":[["School","07:00","13:00"],["Chinese Tuition","15:00","17:00"],["Kiddo Science","20:00","21:30"]],"Saturday":[["24 Festive Drums","08:00","10:30"],["Mathematics Tuition","15:30","17:00"]],"Sunday":[["Basketball","07:30","09:30"],["Taekwondo","17:00","18:30"]]};
const P={"2026-09-20":[["10:15–11:00","Chinese","Units 1–2"],["11:15–12:00","Mathematics","Unit 1"],["14:00–14:45","Bahasa Melayu","Units 1–2"],["15:00–15:40","Science","Unit 1"],["19:30–20:00","History","Units 1–2"]],"2026-09-21":[["19:15–20:00","Chinese","Unit 3"],["20:10–20:45","Mathematics","Unit 2"]],"2026-09-22":[["17:45–18:30","Bahasa Melayu","Unit 3"],["19:45–20:30","English","Unit 1"]],"2026-09-23":[["16:30–17:15","Chinese","Unit 4"],["19:30–20:15","Science","Unit 2"]],"2026-09-24":[["18:30–19:15","Mathematics","Unit 3"],["19:30–20:15","Bahasa Melayu","Unit 4"]],"2026-09-25":[["17:45–18:20","Chinese","Unit 5"],["18:30–19:05","English","Unit 2"]],"2026-09-26":[["11:00–11:45","Chinese","Units 6–7"],["12:00–12:45","Bahasa Melayu","Units 5–6"],["14:00–14:45","Science","Unit 3"],["17:45–18:30","History","Units 3–5"],["19:30–20:10","Moral Education","Units 1–3"]],"2026-09-27":[["10:15–11:00","Chinese","Units 8–9"],["11:15–12:00","Bahasa Melayu","Units 7–8"],["14:00–14:45","Mathematics","Unit 4"],["15:00–15:45","English","Units 3–4"],["19:30–20:15","Science","Unit 4"]],"2026-09-28":[["19:15–20:00","Chinese","Unit 10"],["20:10–20:45","Science","Unit 5"]],"2026-09-29":[["17:45–18:30","Bahasa Melayu","Units 9–10"],["19:45–20:30","Mathematics","Unit 5"]],"2026-09-30":[["16:30–17:15","Chinese","Unit 11"],["19:30–20:15","English","Unit 5"]],"2026-10-01":[["18:30–19:15","Bahasa Melayu","Unit 11"],["19:30–20:15","Science","Unit 6"]],"2026-10-02":[["17:45–18:20","Chinese","Unit 12"],["18:30–19:05","Mathematics","Unit 6"]],"2026-10-03":[["11:00–11:45","Chinese","Units 13–15"],["12:00–12:45","Bahasa Melayu","Units 12–14"],["14:00–14:45","English","Units 6–7"],["17:45–18:30","Science","Units 7–8"],["19:30–20:15","History","Units 6–9"]],"2026-10-04":[["10:15–11:00","Chinese","Units 16–18"],["11:15–12:00","Bahasa Melayu","Units 15–17"],["14:00–14:45","Mathematics","Unit 7"],["15:00–15:45","English","Unit 8"],["19:30–20:15","Moral Education","Units 4–7"]],"2026-10-05":[["19:15–20:00","Chinese","Units 19–20"],["20:10–20:45","Science","Unit 9"]],"2026-10-06":[["17:45–18:30","Bahasa Melayu","Units 18–19"],["19:45–20:30","Mathematics","Unit 8"]],"2026-10-07":[["16:30–17:15","English","Units 9–10"],["19:30–20:15","Science","Unit 10"]],"2026-10-08":[["18:30–19:15","Bahasa Melayu","Units 20–21"],["19:30–20:15","Moral Education","Units 8–10"]],"2026-10-09":[["17:45–18:20","Chinese","Review Units 1–10"],["18:30–19:05","PE & Health","Units 9–10"]],"2026-10-10":[["11:00–11:45","Chinese","Review Units 11–20"],["12:00–12:45","History","Review Units 1–9"],["14:00–14:45","Moral Education","Review Units 1–10"],["17:45–18:30","Bahasa Melayu","Review Units 1–11"],["19:30–20:15","Mathematics","Review Units 1–4"]],"2026-10-11":[["10:15–11:00","Chinese","Final Review Units 1–20"],["11:15–12:00","History","Final Review Units 1–9"],["14:00–14:45","Moral Education","Final Review Units 1–10"],["15:00–15:40","Chinese","Reading / key exercises"]],"2026-10-12":[["18:00–18:45","Bahasa Melayu","Final Review Units 1–21"],["19:00–19:45","Mathematics","Final Review Units 1–8"],["20:00–20:25","PE & Health","Final Review Units 9–10"]],"2026-10-13":[["18:00–18:45","English","Final Review Units 1–10"],["19:00–19:45","Science","Final Review Units 1–10"]],"2026-10-14":[["16:30–17:00","Music","Exam topics"],["17:10–17:50","RBT","Units 1–6"],["19:30–20:10","Art","Units 1–10"]]};
const E=[["2026-10-12","Chinese","08:00–09:15"],["2026-10-12","History","10:40–11:55"],["2026-10-12","Moral Education","12:05–12:50"],["2026-10-13","Bahasa Melayu","08:00–09:15"],["2026-10-13","Mathematics","10:40–11:55"],["2026-10-13","PE & Health","12:05–12:50"],["2026-10-14","English","08:00–09:15"],["2026-10-14","Science","10:40–11:55"],["2026-10-15","Music","08:00–08:30"],["2026-10-15","RBT","09:00–09:45"],["2026-10-15","Art","10:45–11:30"]];
const S=[...new Set(Object.values(P).flat().map(x=>x[1]))],K=(d,i)=>d+"_"+i;let st=JSON.parse(localStorage.getItem("y4v6")||"null")||{done:{},level:{},activities:structuredClone(A)};if(!st.activities)st.activities=structuredClone(A);function save(){localStorage.setItem("y4v6",JSON.stringify(st));render()}function tab(id,b){document.querySelectorAll(".view").forEach(x=>x.classList.remove("on"));document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("on"));document.getElementById(id).classList.add("on");b.classList.add("on")}function dn(x){return["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][x.getDay()]}function iso(x){return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0")}function init(){if(fd.options.length==1){Object.keys(P).forEach(x=>fd.add(new Option(x,x)));S.forEach(x=>fs.add(new Option(x,x)))}}function renderRev(){init();let h="",n=0,t=0;Object.keys(P).forEach(d=>P[d].forEach((p,i)=>{t++;let k=K(d,i),lv=st.level[k]||"yellow",ok=!!st.done[k];if(fd.value&&fd.value!=d||fs.value&&fs.value!=p[1]||fr.value&&!p[2].toLowerCase().includes(fr.value.toLowerCase())||fm.value&&fm.value!=lv||fo.value=="done"&&!ok||fo.value=="todo"&&ok)return;n++;h+=`<tr><td>${d}</td><td>${p[0]}</td><td><b>${p[1]}</b></td><td>${p[2]}</td><td><select onchange="st.level['${k}']=this.value;save()"><option value=red ${lv=="red"?"selected":""}>🔴 Needs Work</option><option value=yellow ${lv=="yellow"?"selected":""}>🟡 Developing</option><option value=green ${lv=="green"?"selected":""}>🟢 Mastered</option></select></td><td><input type=checkbox ${ok?"checked":""} onchange="st.done['${k}']=this.checked;save()"></td></tr>`});});rows.innerHTML=h;sum.textContent=`Showing ${n} of ${t} revision tasks`}function renderCal(){let h=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>"<b>"+x+"</b>").join(""),x=new Date(2026,8,20),z=new Date(2026,9,17),today=iso(new Date());for(;x<=z;x.setDate(x.getDate()+1)){let d=iso(x),ee=E.filter(e=>e[0]==d);h+=`<div class="day ${d==today?"today":""} ${ee.length?"examday":""}"><b>${x.getMonth()+1}/${x.getDate()}${d==today?" · TODAY":""}</b>`;ee.forEach(e=>h+=`<div class=exam>EXAM · ${e[1]} ${e[2]}</div>`);(st.activities[dn(x)]||[]).forEach(a=>h+=`<div class=fixed>${a[1]} · ${a[0]}–${a[2]}</div>`);(P[d]||[]).forEach((p,i)=>h+=`<div class="rev ${st.done[K(d,i)]?"done":""}">${p[0]} · ${p[1]} · ${p[2]}</div>`);h+="</div>"}cal.innerHTML=h}function renderActs(){let h="";Object.keys(st.activities).forEach(d=>st.activities[d].forEach((a,i)=>h+=`<tr><td>${d}</td><td><input value="${a[0]}" onchange="st.activities['${d}'][${i}][0]=this.value;save()"></td><td><input type=time value="${a[1]}" onchange="st.activities['${d}'][${i}][1]=this.value;save()"></td><td><input type=time value="${a[2]}" onchange="st.activities['${d}'][${i}][2]=this.value;save()"></td></tr>`));acts.innerHTML=h}function render(){renderCal();renderRev();renderActs();examrows.innerHTML=E.map(e=>`<tr><td>${e[0]}</td><td><b>${e[1]}</b></td><td>${e[2]}</td></tr>`).join("");let ks=[];Object.keys(P).forEach(d=>P[d].forEach((_,i)=>ks.push(K(d,i))));let n=ks.filter(k=>st.done[k]).length;pct.textContent=Math.round(n/ks.length*100)+"%";completed.textContent=n+"/"+ks.length}render();
</script></main></body></html>
